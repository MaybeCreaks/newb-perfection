name = "Newb Perfection"
author = "MaybeCreaks, devendrn"
version = "1.0.0"
url = "https://github.com/MaybeCreaks/newb-perfection"
description = "The Perfect Newb Shader."
min_engine_version = [1, 26, 40]

materials = [
  "Actor",
  "ActorGlint",
  "ActorMultiTexture",
  "Clouds",
  "EndSky",
  "ItemInHandColor",
  "ItemInHandColorGlint",
  "ItemInHandTextured",
  "RenderChunk",
  "Sky",
  "Stars",
  "SunMoon",
  "Weather"
]

[[subpack]]
name = "Default"
