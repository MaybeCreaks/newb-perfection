[[subpack]]
name = "No Glowing Ores - No Wave"
define = "NO_GLOWING_ORES_NO_WAVE"
materials = ["RenderChunk"]
description = "no glowing ores - no wave"

[[subpack]]
name = "No Wave"
define = "NO_WAVE"
materials = ["RenderChunk"]
description = "no wave"