name: Build Windows Shader Pack

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Windows .mcpack
        run: |
          ./build.sh pack -p windows

      - name: Upload .mcpack
        uses: actions/upload-artifact@v4
        with:
          name: np-1.0-windows
          path: build/*.mcpack